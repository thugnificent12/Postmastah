name: Android APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepara i file del gioco
        run: |
          mkdir -p capacitor/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png capacitor/www/
      - name: Crea il progetto Android
        working-directory: capacitor
        run: |
          npm install
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp ../android-icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp ../android-icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp ../android-icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          npx cap sync android
      - name: Firma sempre con la stessa chiave (cosi' gli aggiornamenti si installano sopra)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
      - name: Costruisci l'APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: il-direttore-ufficio-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Pubblica l'APK nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp capacitor/android/app/build/outputs/apk/debug/app-debug.apk il-direttore-ufficio.apk
          gh release delete apk-latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create apk-latest il-direttore-ufficio.apk --repo ${{ github.repository }} --target main --title "Il Direttore dell'Ufficio (Android)" --notes "Tocca il file il-direttore-ufficio.apk per scaricarlo e installarlo."
